apiVersion: v1
kind: Pod
metadata:
  name: quarkus-kafka-sandbox-pod

spec:
  containers:
    - name: consumer
      image: consumer:latest
      ports:
        - containerPort: 8080
      env:
        - name: KAFKA_URL
          value: localhost:9092
        - name: PG_USER
          value: postgres
        - name: PG_PASSWORD
          value: postgres
        - name: PG_URL
          value: jdbc:postgresql://localhost:5432/postgres
      resources:
        limits:
          cpu: 0.5
          memory: 500Mi

    - name: producer
      image: producer:latest
      ports:
        - containerPort: 8081
      env:
        - name: KAFKA_URL
          value: localhost:9092
      resources:
        limits:
          cpu: 0.5
          memory: 500Mi

    - name: postgres
      image: postgres:17-alpine
      ports:
        - containerPort: 5432
          hostPort: 5432
      env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: postgres
      resources:
        limits:
          cpu: 0.5
          memory: 500Mi
      volumes:
        - postgres_data:/var/lib/postgresql/data

    - name: kafka
      image: apache/kafka:3.8.0
      ports:
        - containerPort: 9092
          hostPort: 9092
      env:
        - name: KAFKA_NODE_ID
          value: 1
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: CONTROLLER://:9093,PLAINTEXT_HOST://:9092
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT_HOST://localhost:9092
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@localhost:9093
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: 1
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: 1
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: 1
        - name: CLUSTER_ID
          value: "4L6g3nShT-eMCtK--X86sw"
      resources:
        limits:
          cpu: 0.5
          memory: 500Mi
      volumes:
        - kafka_data:/var/lib/kafka/data

    - name: kafka-ui
      image: provectuslabs/kafka-ui:latest
      ports:
        - containerPort: 8080
          hostPort: 8081
      env:
        - name: KAFKA_CLUSTERS_0_NAME
          value: local
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: localhost:9092
      resources:
        limits:
          cpu: 0.5
          memory: 500Mi

  volumes:
    - name: postgres_data
    - name: kafka_data