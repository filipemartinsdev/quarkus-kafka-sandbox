apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kafka-pvc

---

apiVersion: v1
kind: Pod
metadata:
  name: infra-pod
spec:
  containers:
    - name: postgres
      image: docker.io/postgres:17-alpine
      ports:
        - containerPort: 5432
          hostPort: 5432
      env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: postgres
      resources:
        limits:
          cpu: 0.5
          memory: 500Mi
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data

    - name: kafka
      image: docker.io/apache/kafka:3.8.0
      ports:
        - containerPort: 9092
          hostPort: 9092
      env:
        - name: KAFKA_NODE_ID
          value: 1
        - name: KAFKA_PROCESS_ROLES
          value: broker,controller
        - name: KAFKA_LISTENERS
          value: CONTROLLER://:9093,PLAINTEXT://:9092
        - name: KAFKA_ADVERTISED_LISTENERS
          value: PLAINTEXT://localhost:9092
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: CONTROLLER
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: 1@localhost:9093
        - name: KAFKA_INTER_BROKER_LISTENER_NAME
          value: PLAINTEXT
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: 1
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: 1
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: 1
        - name: CLUSTER_ID
          value: "4L6g3nShT-eMCtK--X86sw"
      resources:
        limits:
          cpu: 0.5
          memory: 500Mi
      volumeMounts:
        - name: kafka-data
          mountPath: /var/lib/kafka/data

    - name: kafka-ui
      image: docker.io/provectuslabs/kafka-ui:latest
      ports:
        - containerPort: 8081
          hostPort: 8081
      env:
        - name: SERVER_PORT
          value: 8081
        - name: KAFKA_CLUSTERS_0_NAME
          value: local
        - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
          value: localhost:9092
      resources:
        limits:
          cpu: 0.5
          memory: 500Mi
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: postgres-pvc
    - name: kafka-data
      persistentVolumeClaim:
        claimName: kafka-pvc

---

apiVersion: v1
kind: Pod
metadata:
  name: consumer-pod
spec:
  containers:
    - name: consumer
      image: consumer:latest
      ports:
        - containerPort: 8080
          hostPort: 8080
      env:
        - name: KAFKA_URL
          value: host.containers.internal:9092
        - name: PG_USER
          value: postgres
        - name: PG_PASSWORD
          value: postgres
        - name: PG_URL
          value: jdbc:postgresql://host.containers.internal:5432/postgres
      resources:
        limits:
          cpu: 0.5
          memory: 500Mi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: producer-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: producer
  template:
    metadata:
      labels:
        app: producer
    spec:
      containers:
        - name: producer
          image: producer:latest
          env:
            - name: KAFKA_URL
              value: host.containers.internal:9092
          resources:
            limits:
              cpu: "0.5"
              memory: "500Mi"